<script>
    let allData = []; 

    // 1. Ambil data dari file data.json
    fetch('data.json')
        .then(response => {
            if (!response.ok) throw new Error("File data.json tidak ditemukan");
            return response.json();
        })
        .then(data => {
            allData = data;
            setupFilters(data); 
            renderPerda(data);  
        })
        .catch(error => {
            console.error('Gagal load data:', error);
            document.getElementById('containerPerda').innerHTML = 
                '<p style="color:red; text-align:center;">Gagal memuat data. Pastikan file data.json sudah diupload.</p>';
        });

    // 2. Fungsi isi Dropdown
    function setupFilters(data) {
        const tahunSet = new Set();
        const kategoriSet = new Set();

        data.forEach(item => {
            tahunSet.add(item.tahun);
            kategoriSet.add(item.kategori);
        });

        const selectTahun = document.getElementById('filterTahun');
        const selectKategori = document.getElementById('filterKategori');

        // Kosongkan dulu opsi default selain "Semua"
        selectTahun.innerHTML = '<option value="">Semua Tahun</option>';
        selectKategori.innerHTML = '<option value="">Semua Kategori</option>';

        [...tahunSet].sort().reverse().forEach(t => {
            selectTahun.innerHTML += `<option value="${t}">${t}</option>`;
        });

        [...kategoriSet].sort().forEach(k => {
            selectKategori.innerHTML += `<option value="${k}">${k}</option>`;
        });
    }

    // 3. Fungsi Tampilkan Data
    function renderPerda(list) {
        const container = document.getElementById('containerPerda');
        container.innerHTML = ''; 

        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:20px; color:#666;">Tidak ada data yang cocok.</p>';
            return;
        }

        list.forEach(item => {
            const statusClass = item.status === 'Berlaku' ? 'tag-status-ok' : 'tag-status-no';
            
            const html = `
                <div class="perda-card">
                    <div class="perda-title">Perda No. ${item.nomor} Tahun ${item.tahun}</div>
                    <div style="font-weight:600; margin-bottom:8px;">${item.judul}</div>
                    <div class="meta-tags">
                        <span class="tag tag-cat">${item.kategori}</span>
                        <span class="tag ${statusClass}">${item.status}</span>
                        <span style="color:#64748b;"> ${item.tanggal}</span>
                    </div>
                    <div class="desc">${item.deskripsi}</div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    // 4. Logika Filter
    function applyFilters() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const tahun = document.getElementById('filterTahun').value;
        const kategori = document.getElementById('filterKategori').value;

        const filtered = allData.filter(item => {
            const matchKeyword = item.judul.toLowerCase().includes(keyword) || 
                                 item.nomor.includes(keyword);
            const matchTahun = tahun === "" || item.tahun === tahun;
            const matchKategori = kategori === "" || item.kategori === kategori;

            return matchKeyword && matchTahun && matchKategori;
        });

        renderPerda(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('filterTahun').addEventListener('change', applyFilters);
    document.getElementById('filterKategori').addEventListener('change', applyFilters);
</script>
