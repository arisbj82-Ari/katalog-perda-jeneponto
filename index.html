<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Perda - Kabupaten Jeneponto</title>
    
    <!-- CSS DIGABUNGKAN DI SINI -->
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* Konten utama */
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            text-align: center;
        }

        .welcome-box h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            background-color: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- BAGIAN HEADER (Atas) -->
    <header>
        <h1>Katalog Peraturan Daerah</h1>
        <p>Sekretariat DPRD Kabupaten Jeneponto</p>
    </header>

    <!-- BAGIAN KONTEN UTAMA (Tengah) -->
    <main>
        <div class="welcome-box">
            <h2>Selamat Datang</h2>
            <p>Ini adalah katalog digital Peraturan Daerah Kabupaten Jeneponto.</p>
            <p>Website ini sedang dalam pengembangan...</p>
        </div>
    </main>

    <!-- BAGIAN FOOTER (Bawah) -->
    <footer>
        <p>&copy; 2026 Sekretariat DPRD Kabupaten Jeneponto</p>
    </footer>

</body>
</html>
